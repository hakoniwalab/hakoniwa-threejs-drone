name: Validate Three.js Drone Viewer

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Doctor
        run: python tools/hako.py doctor
      - name: Test
        run: python tools/hako.py test
      - name: Smoke
        run: python tools/hako.py smoke
