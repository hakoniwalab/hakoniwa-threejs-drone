<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Hakoniwa Three.js Drone Viewer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   sans-serif;
    }

    #main-container {
      display: flex;
      height: 100%;
      width: 100%;
    }

    #panel {
      width: 260px;
      background-color: #f0f0f0;
      padding: 10px;
      box-sizing: border-box;
      border-right: 1px solid #ccc;
      overflow-y: auto;
    }

    #panel h3 {
      margin: 12px 0 6px;
      font-size: 14px;
    }

    #panel button {
      padding: 6px 10px;
      font-size: 14px;
      cursor: pointer;
    }

    #panel input[type="number"] {
      width: 72px;
      padding: 4px 6px;
      font-size: 13px;
      box-sizing: border-box;
    }
    #panel input[type="range"] {
      width: 100%;
    }

    #scenario-hud {
      position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 5;
      padding: 6px 18px; border-radius: 10px; background: rgba(0, 0, 0, 0.45); color: #fff;
      text-align: center; font-family: -apple-system, "Hiragino Sans", sans-serif; pointer-events: none;
    }
    #hud-speed { font-size: 40px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
    #hud-speed span { font-size: 16px; font-weight: 400; }
    #hud-acc { font-size: 15px; }
    #hud-acc.accelerating { color: #ffb74d; font-weight: 700; }
    #hud-acc.canceled { color: #ef9a9a; }

    #viewer-container {
      flex: 1;
      background: #000;
      position: relative;
    }

    #three-root {
      width: 100%;
      height: 100%;
    }

    .prop-box {
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #f9f9f9;
      padding: 6px 8px;
      margin-top: 10px;
    }
    .prop-box h4 {
      margin: 0 0 6px 0;
      font-size: 13px;
      font-weight: bold;
    }
    .prop-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .prop-table td {
      padding: 2px 4px;
    }
    .prop-table .label {
      width: 40px;
    }
    .prop-table .value {
      text-align: right;
    }
    .fault-grid {
      display: grid;
      grid-template-columns: 54px 1fr auto;
      gap: 6px 8px;
      align-items: center;
      font-size: 12px;
    }
    .compass-widget {
      position: relative;
      width: 96px;
      height: 96px;
      border: 2px solid #999;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, #ffffff 0 34%, #f2f2f2 35% 100%);
      justify-self: start;
      cursor: crosshair;
      user-select: none;
      touch-action: none;
    }
    .compass-widget::before,
    .compass-widget::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      background: rgba(0, 0, 0, 0.12);
      transform: translate(-50%, -50%);
    }
    .compass-widget::before {
      width: 2px;
      height: 84px;
    }
    .compass-widget::after {
      width: 84px;
      height: 2px;
    }
    .compass-label {
      position: absolute;
      font-size: 10px;
      font-weight: 700;
      color: #555;
      pointer-events: none;
    }
    .compass-label.n { top: 4px; left: 50%; transform: translateX(-50%); }
    .compass-label.e { top: 50%; right: 6px; transform: translateY(-50%); }
    .compass-label.s { bottom: 4px; left: 50%; transform: translateX(-50%); }
    .compass-label.w { top: 50%; left: 6px; transform: translateY(-50%); }
    .compass-pointer {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      transform-origin: 0 0;
      pointer-events: none;
    }
    .compass-pointer::before {
      content: "";
      position: absolute;
      left: 0;
      top: -5px;
      width: 38px;
      height: 10px;
      clip-path: polygon(0 50%, 72% 0, 100% 50%, 72% 100%);
      background: #cc2b2b;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
    }
    .compass-center-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 10px;
      background: #333;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .fault-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .drone-only.hidden-for-vehicles {
      display: none;
    }

    .scenario-events {
      margin: 6px 0 0;
      padding-left: 18px;
      max-height: 220px;
      overflow-y: auto;
      font-size: 12px;
    }

    .scenario-events li.complete {
      color: #666;
    }

    .fault-status {
      margin-top: 8px;
      min-height: 16px;
      font-size: 12px;
      color: #333;
    }
  </style>
</head>
<body>
  <div id="main-container">
    <!-- 左パネル -->
    <div id="panel">
      <button id="connect-btn">connect</button>

      <div class="prop-box" id="scenario-box" hidden>
        <h4>シナリオ</h4>
        <div class="fault-actions">
          <select id="scenario-variant" hidden></select>
          <button id="scenario-start-btn" type="button" disabled>スタート</button>
          <span id="scenario-status" class="fault-status">接続中</span>
        </div>
        <div style="margin-top: 6px;">
          <label><input type="checkbox" id="scenario-night"> 夜</label>
          <label style="margin-left: 8px;"><input type="checkbox" id="scenario-route"> 予定ルート</label>
        </div>
        <table class="prop-table" id="scenario-speeds"></table>
        <ol id="scenario-events" class="scenario-events"></ol>
      </div>

      <div style="margin-top: 8px;">
        <label for="ws-uri-input"><strong>WebSocket URI</strong></label><br>
        <input
          id="ws-uri-input"
          type="text"
          style="width: 100%;"
          value="ws://127.0.0.1:8765"
        >
      </div>

      <div class="drone-only" style="margin-top: 8px;">
        <label for="drone-select"><strong>Drone</strong></label><br>
        <select id="drone-select" style="width: 100%;"></select>
      </div>

      <div class="drone-only" style="margin-top: 4px;">
        <label>
          <input type="checkbox" id="follow-checkbox" checked>
          Follow selected
        </label>
        <div class="camera-view-buttons" style="margin-top: 5px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px;">
          <style>.camera-view-buttons button, .camera-view-buttons strong { white-space: nowrap; }</style>
          <strong style="font-size: 12px; margin-right: 2px;">視点</strong>
          <button id="camera-driver-btn" type="button" aria-pressed="false" hidden>運転席</button>
          <button id="camera-follow-btn" type="button" aria-pressed="true">追従</button>
          <button id="camera-front-btn" type="button" aria-pressed="false">前方</button>
          <button id="camera-overview-btn" type="button" aria-pressed="false">全体</button>
          <button id="camera-zoom-in-btn" type="button" aria-label="拡大">＋</button>
          <button id="camera-zoom-out-btn" type="button" aria-label="縮小">−</button>
          <button id="overview-inset-btn" type="button" aria-pressed="false">全体を小窓に</button>
        </div>
      </div>

      <div class="prop-box drone-only">
        <h4>Drone State (debug)</h4>
        <table class="prop-table">
          <tbody>
            <tr><td class="label">x:</td><td class="value" id="prop-x"></td></tr>
            <tr><td class="label">y:</td><td class="value" id="prop-y"></td></tr>
            <tr><td class="label">z:</td><td class="value" id="prop-z"></td></tr>
          </tbody>
          <tbody id="pwm-state-rows"></tbody>
        </table>
      </div>

      <div class="prop-box drone-only">
        <h4 id="rotor-fault-heading">Rotor Fault Injection</h4>
        <div id="rotor-scale-controls" class="fault-grid"></div>
        <div class="fault-actions">
          <button id="fault-send-btn" type="button">send</button>
          <button id="fault-reset-btn" type="button">reset</button>
        </div>
        <div id="fault-status" class="fault-status"></div>
      </div>

      <div class="prop-box drone-only">
        <h4 id="wind-disturbance-heading">Wind Disturbance (ROS)</h4>
        <div class="fault-grid">
          <label for="wind-heading-deg">Heading</label>
          <div id="wind-heading-compass" class="compass-widget" aria-label="Wind heading compass">
            <span class="compass-label n">+X</span>
            <span class="compass-label e">-Y</span>
            <span class="compass-label s">-X</span>
            <span class="compass-label w">+Y</span>
            <div id="wind-heading-pointer" class="compass-pointer"></div>
            <div class="compass-center-dot"></div>
          </div>
          <input id="wind-heading-deg" type="number" min="0" max="360" step="5" value="0">

          <label for="wind-speed-mps">Speed</label>
          <input id="wind-speed-slider" type="range" min="0" max="20" step="0.5" value="0">
          <input id="wind-speed-mps" type="number" min="0" max="20" step="0.5" value="0.0">
        </div>
        <div id="wind-status" class="fault-status"></div>
      </div>
    </div>

    <!-- 右：Three.js -->
    <div id="viewer-container">
      <div id="scenario-hud" hidden><div id="hud-speed">0 <span>km/h</span></div><div id="hud-acc"></div></div>
      <div id="three-root"></div>
    </div>
  </div>

  <!-- ES module shims & importmap -->
  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <!-- UI配線専用モジュール -->
  <script type="module">
    import { createDroneViewer } from "./src/public/drone_viewer.js";
    import { loadViewerConfig } from "./src/viewer_config_loader.js";
    import { ScenarioPanel, validateScenarioPanel } from "./src/scenario_panel.js";
    import { TrafficSignals } from "./src/traffic_signals.js";
    import {
      buildPwmRows,
      buildRotorScaleControls,
      normalizeRotorCount,
    } from "./src/fault_injection/rotor_controls.js";

    const viewer = createDroneViewer();
    window.droneViewer = viewer;
    // Debug helper for browser console inspection.
    window.__hakoniwaViewer = viewer;

    function getDronesFromViewer() {
      return viewer.getDrones();
    }

    document.addEventListener('DOMContentLoaded', () => {
      const connectBtn = document.getElementById('connect-btn');
      const droneSelect = document.getElementById("drone-select");
      const followCheckbox = document.getElementById("follow-checkbox");
      const cameraDriverBtn = document.getElementById("camera-driver-btn");
      const cameraFollowBtn = document.getElementById("camera-follow-btn");
      const cameraFrontBtn = document.getElementById("camera-front-btn");
      const cameraOverviewBtn = document.getElementById("camera-overview-btn");
      const cameraZoomInBtn = document.getElementById("camera-zoom-in-btn");
      const cameraZoomOutBtn = document.getElementById("camera-zoom-out-btn");
      const overviewInsetBtn = document.getElementById("overview-inset-btn");
      const wsUriInput = document.getElementById('ws-uri-input');
      const stateX = document.getElementById('prop-x');
      const stateY = document.getElementById('prop-y');
      const stateZ = document.getElementById('prop-z');
      const pwmStateRows = document.getElementById('pwm-state-rows');
      const rotorScaleControls = document.getElementById('rotor-scale-controls');
      let statePwmDuty = [];
      let rotorScaleInputs = [];
      let rotorScaleSliders = [];
      const faultSendBtn = document.getElementById('fault-send-btn');
      const faultResetBtn = document.getElementById('fault-reset-btn');
      const faultStatus = document.getElementById('fault-status');
      const rotorFaultHeading = document.getElementById('rotor-fault-heading');
      const windDisturbanceHeading = document.getElementById('wind-disturbance-heading');
      const windHeadingCompass = document.getElementById('wind-heading-compass');
      const windHeadingPointer = document.getElementById('wind-heading-pointer');
      const windHeadingInput = document.getElementById('wind-heading-deg');
      const windSpeedInput = document.getElementById('wind-speed-mps');
      const windSpeedSlider = document.getElementById('wind-speed-slider');
      const windStatus = document.getElementById('wind-status');

      function clampScaleValue(value) {
        const num = Number(value);
        if (!Number.isFinite(num)) {
          return 1.0;
        }
        return Math.max(0.0, Math.min(1.0, num));
      }

      function getRotorScalesFromInputs() {
        return rotorScaleInputs.map((input) => {
          return clampScaleValue(input?.value ?? 1.0);
        });
      }

      function setRotorScalesToInputs(scales = []) {
        rotorScaleInputs.forEach((input, index) => {
          if (!input) return;
          const value = clampScaleValue(scales[index] ?? 1.0);
          input.value = value.toFixed(1);
          if (rotorScaleSliders[index]) {
            rotorScaleSliders[index].value = value.toFixed(1);
          }
        });
      }

      function setFaultStatus(message, isError = false) {
        if (!faultStatus) return;
        faultStatus.textContent = message;
        faultStatus.style.color = isError ? "#b00020" : "#333";
      }

      function clampHeadingDeg(value) {
        const num = Number(value);
        if (!Number.isFinite(num)) {
          return 0.0;
        }
        let normalized = num % 360.0;
        if (normalized < 0) {
          normalized += 360.0;
        }
        return normalized;
      }

      function clampWindSpeed(value) {
        const num = Number(value);
        if (!Number.isFinite(num)) {
          return 0.0;
        }
        return Math.max(0.0, Math.min(20.0, num));
      }

      function getWindFromInputs() {
        return {
          headingDeg: clampHeadingDeg(windHeadingInput?.value ?? 0.0),
          speedMps: clampWindSpeed(windSpeedInput?.value ?? 0.0),
        };
      }

      function setWindToInputs({ headingDeg = 0.0, speedMps = 0.0 } = {}) {
        const heading = clampHeadingDeg(headingDeg);
        const speed = clampWindSpeed(speedMps);
        if (windHeadingInput) windHeadingInput.value = heading.toFixed(0);
        if (windSpeedInput) windSpeedInput.value = speed.toFixed(1);
        if (windSpeedSlider) windSpeedSlider.value = speed.toFixed(1);
        if (windHeadingPointer) {
          windHeadingPointer.style.transform = `translate(-50%, -50%) rotate(${-90 - heading}deg)`;
        }
      }

      function setWindStatus(message, isError = false) {
        if (!windStatus) return;
        windStatus.textContent = message;
        windStatus.style.color = isError ? "#b00020" : "#333";
      }

      async function sendCurrentRotorScales() {
        const scales = getRotorScalesFromInputs();
        setRotorScalesToInputs(scales);
        const wind = getWindFromInputs();
        setWindToInputs(wind);
        try {
          viewer.setWind(wind);
          const ok = await viewer.sendRotorFaultScales(scales);
          if (ok) {
            setFaultStatus(`sent [${scales.map((v) => v.toFixed(1)).join(", ")}]`);
            setWindStatus(`sent heading=${wind.headingDeg.toFixed(0)} speed=${wind.speedMps.toFixed(1)}`);
          } else {
            setFaultStatus("send failed", true);
            setWindStatus("send failed", true);
          }
          return ok;
        } catch (e) {
          console.error(e);
          setFaultStatus("send error", true);
          setWindStatus("send error", true);
          return false;
        }
      }

      function bindRotorScaleControls() {
        rotorScaleInputs.forEach((input, index) => {
          const slider = rotorScaleSliders[index];
          if (input) {
            input.addEventListener("input", () => {
              const value = clampScaleValue(input.value);
              input.value = value.toFixed(1);
              if (slider) {
                slider.value = value.toFixed(1);
              }
              viewer.setRotorFaultScale(index, value);
            });
            input.addEventListener("change", async () => {
              await sendCurrentRotorScales();
            });
          }
          if (slider) {
            slider.addEventListener("input", () => {
              const value = clampScaleValue(slider.value);
              slider.value = value.toFixed(1);
              if (input) {
                input.value = value.toFixed(1);
              }
              viewer.setRotorFaultScale(index, value);
            });
            slider.addEventListener("change", async () => {
              await sendCurrentRotorScales();
            });
          }
        });
      }

      function configureRotorControls(rotorCount = 4) {
        const count = normalizeRotorCount(rotorCount);
        if (pwmStateRows) {
          pwmStateRows.innerHTML = buildPwmRows(count);
        }
        if (rotorScaleControls) {
          rotorScaleControls.innerHTML = buildRotorScaleControls(count);
        }
        statePwmDuty = Array.from({ length: count }, (_, index) =>
          document.getElementById(`prop-pwm-${index}`));
        rotorScaleInputs = Array.from({ length: count }, (_, index) =>
          document.getElementById(`rotor-scale-${index}`));
        rotorScaleSliders = Array.from({ length: count }, (_, index) =>
          document.getElementById(`rotor-scale-slider-${index}`));
        setRotorScalesToInputs(viewer.getRotorFaultScales());
        bindRotorScaleControls();
      }

      function updateFaultInjectionTarget() {
        const fault = viewer.getFaultInjectionConfig();
        if (!fault || !Array.isArray(fault.robotNames)) return;

        const selectedName = droneSelect?.value;
        const isDrone = viewer.getDrones().some((drone) => String(drone.droneId) === selectedName);
        const targetName = viewer.setFaultInjectionTarget(isDrone ? selectedName : null);
        const enabled = !!targetName;
        const headingTarget = targetName ?? "not available";
        if (rotorFaultHeading) rotorFaultHeading.textContent = `Rotor Fault Injection (${headingTarget})`;
        if (windDisturbanceHeading) windDisturbanceHeading.textContent = `Wind Disturbance (ROS) (${headingTarget})`;
        for (const control of [
          ...rotorScaleInputs,
          ...rotorScaleSliders,
          faultSendBtn,
          faultResetBtn,
          windHeadingInput,
          windSpeedInput,
          windSpeedSlider,
        ]) {
          if (control) control.disabled = !enabled;
        }
        if (!enabled) {
          setFaultStatus("selected Drone is not an injection target", true);
          setWindStatus("selected Drone is not an injection target", true);
          return;
        }
        setRotorScalesToInputs(viewer.getRotorFaultScales());
        setWindToInputs(viewer.getWind());
        setFaultStatus("not sent");
        setWindStatus("not sent");
      }

      function bindWindControls() {
        let compassDragging = false;

        function readHeadingFromCompassEvent(event) {
          if (!windHeadingCompass) {
            return 0.0;
          }
          const rect = windHeadingCompass.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const dx = event.clientX - cx;
          const dy = cy - event.clientY;
          const deg = Math.atan2(-dx, dy) * 180.0 / Math.PI;
          return clampHeadingDeg(deg);
        }

        function applyCompassHeading(heading) {
          const normalized = clampHeadingDeg(heading);
          if (windHeadingInput) {
            windHeadingInput.value = normalized.toFixed(0);
          }
          viewer.setWindHeadingDeg(normalized);
          setWindToInputs({
            headingDeg: normalized,
            speedMps: getWindFromInputs().speedMps,
          });
        }

        if (windHeadingCompass) {
          windHeadingCompass.addEventListener("mousedown", (event) => {
            compassDragging = true;
            applyCompassHeading(readHeadingFromCompassEvent(event));
          });
          window.addEventListener("mousemove", (event) => {
            if (!compassDragging) {
              return;
            }
            applyCompassHeading(readHeadingFromCompassEvent(event));
          });
          window.addEventListener("mouseup", async () => {
            if (!compassDragging) {
              return;
            }
            compassDragging = false;
            await sendCurrentRotorScales();
          });
          windHeadingCompass.addEventListener("click", async (event) => {
            applyCompassHeading(readHeadingFromCompassEvent(event));
            await sendCurrentRotorScales();
          });
        }

        if (windHeadingInput) {
          windHeadingInput.addEventListener("input", () => {
            const heading = clampHeadingDeg(windHeadingInput.value);
            windHeadingInput.value = heading.toFixed(0);
            viewer.setWindHeadingDeg(heading);
            setWindToInputs({
              headingDeg: heading,
              speedMps: getWindFromInputs().speedMps,
            });
          });
          windHeadingInput.addEventListener("change", async () => {
            await sendCurrentRotorScales();
          });
        }
        if (windSpeedInput) {
          windSpeedInput.addEventListener("input", () => {
            const speed = clampWindSpeed(windSpeedInput.value);
            windSpeedInput.value = speed.toFixed(1);
            if (windSpeedSlider) {
              windSpeedSlider.value = speed.toFixed(1);
            }
            viewer.setWindSpeedMps(speed);
          });
          windSpeedInput.addEventListener("change", async () => {
            await sendCurrentRotorScales();
          });
        }
        if (windSpeedSlider) {
          windSpeedSlider.addEventListener("input", () => {
            const speed = clampWindSpeed(windSpeedSlider.value);
            windSpeedSlider.value = speed.toFixed(1);
            if (windSpeedInput) {
              windSpeedInput.value = speed.toFixed(1);
            }
            viewer.setWindSpeedMps(speed);
          });
          windSpeedSlider.addEventListener("change", async () => {
            await sendCurrentRotorScales();
          });
        }
      }

      function populateDroneSelect() {
        const drones = getDronesFromViewer();
        const vehicles = viewer.getVehicles();

        // 一旦クリア
        droneSelect.innerHTML = "";

        drones.forEach((drone, index) => {
          const opt = document.createElement("option");

          // Drone に name があれば使う
          // なければ ID (droneId) を使う
          opt.value = drone.droneId ?? index;
          opt.textContent = drone.name ?? `${drone.droneId}`;

          droneSelect.appendChild(opt);
        });
        vehicles.forEach((vehicle, index) => {
          const opt = document.createElement("option");
          opt.value = vehicle.vehicleId ?? index;
          opt.textContent = vehicle.name ?? vehicle.cfg?.name ?? vehicle.vehicleId ?? `Vehicle-${index + 1}`;
          droneSelect.appendChild(opt);
        });
        if (droneSelect.options.length > 0 && droneSelect.selectedIndex < 0) {
          droneSelect.selectedIndex = 0;
        }
      }
      function showCameraMode(mode, detail = {}) {
        const objectiveViewMain = detail.objectiveViewMain ?? viewer.isObjectiveViewMain();
        const showDriver = detail.attachedCameraPresentation == null
          ? !cameraDriverBtn.hidden
          : detail.attachedCameraPresentation === "main" && detail.hasAttachedCamera;
        cameraDriverBtn.hidden = !showDriver;
        const setActive = (button, active) => {
          if (!button) return;
          button.setAttribute("aria-pressed", String(active));
          button.style.fontWeight = active ? "bold" : "normal";
          button.style.background = active ? "#dbeafe" : "";
        };
        setActive(cameraDriverBtn, showDriver && !objectiveViewMain);
        setActive(cameraFollowBtn, objectiveViewMain && mode === "follow");
        setActive(cameraFrontBtn, objectiveViewMain && mode === "front");
        setActive(cameraOverviewBtn, objectiveViewMain && mode === "overview");
        const zoomDisabled = !objectiveViewMain || !["follow", "front", "overview"].includes(mode);
        cameraZoomInBtn.disabled = zoomDisabled;
        cameraZoomOutBtn.disabled = zoomDisabled;
        if (followCheckbox && ["follow", "fixed", "front", "overview"].includes(mode)) {
          followCheckbox.checked = mode === "follow";
        }
      }
      function applyFollowSelectedIfEnabled() {
        if (!followCheckbox?.checked) {
          return;
        }
        const selectedId = droneSelect?.value;
        if (!selectedId) return;
        viewer.focusDroneById(selectedId);
      }
      // --- 選択中ドローンを取得 ---
      function getSelectedDrone() {
        const drones = getDronesFromViewer();
        if (!drones.length) return null;

        const selId = droneSelect.value;
        if (!selId) return drones[0];

        const found = drones.find(d => String(d.droneId) === selId);
        return found || drones[0];
      }
      // --- 状態パネルを定期更新 ---
      function updateDroneStatePanel() {
        const d = getSelectedDrone();
        if (!d || !d.latestPose || !d.latestPose.rosPos) {
          // データがまだ来てないときは空にしておく
          stateX.textContent = "";
          stateY.textContent = "";
          stateZ.textContent = "";
          statePwmDuty.forEach((el) => { if (el) el.textContent = ""; });
          return;
        }

        const [x, y, z] = d.latestPose.rosPos;
        stateX.textContent = x.toFixed(2);
        stateY.textContent = y.toFixed(2);
        stateZ.textContent = z.toFixed(2);
        statePwmDuty.forEach((el, index) => {
          if (!el) return;
          const directValue = d.pwmDuty?.[index];
          const fallbackValue = Number.isFinite(d.rotorSpeeds?.[index])
            ? d.rotorSpeeds[index] / 200.0
            : undefined;
          const value = Number.isFinite(directValue) ? directValue : fallbackValue;
          el.textContent = Number.isFinite(value) ? value.toFixed(3) : "n/a";
        });
      }

      configureRotorControls();
      setWindToInputs(viewer.getWind());
      bindWindControls();
      setFaultStatus("not sent");
      setWindStatus("not sent");

      if (!connectBtn) {
        console.warn("connect-btn not found");
        return;
      }
      let loadedViewerConfig = null;
      let statePanelIntervalMsec = 100;
      loadViewerConfig()
        .then(async ({ configUrl, config }) => {
          loadedViewerConfig = config;
          statePanelIntervalMsec = config.ui?.statePanelIntervalMsec ?? 100;
          viewer.configure(config);
          configureRotorControls(config.faultInjection?.rotorCount ?? 4);
          if (wsUriInput) {
            wsUriInput.value = config.pdu.wsUri;
          }
          await viewer.initialize();
          if (overviewInsetBtn && config.ui?.overviewInset === true) {
            overviewInsetBtn.setAttribute("aria-pressed", "true");
            overviewInsetBtn.style.fontWeight = "bold";
            overviewInsetBtn.style.background = "#dbeafe";
          }
          populateDroneSelect();
          updateFaultInjectionTarget();
          validateScenarioPanel(config.scenarioPanel);
          setupScenarioBox(config);
          // A scene without Drones (cars, people): the Drone controls are not used.
          if (viewer.getDrones().length === 0) {
            document.querySelectorAll('.drone-only').forEach((element) => element.classList.add('hidden-for-vehicles'));
          }
          if (config.pdu?.autoConnect) {
            connectBtn.click();
          }
          console.log("[DroneViewer] loaded viewer config:", configUrl, config);
        })
        .catch((e) => {
          console.error(e);
        });

      // --- Scenario panel (viewerConfig.scenarioPanel) ---------------------------
      const scenarioBox = document.getElementById('scenario-box');
      const scenarioStartBtn = document.getElementById('scenario-start-btn');
      const scenarioStatus = document.getElementById('scenario-status');
      const scenarioEvents = document.getElementById('scenario-events');
      const scenarioNight = document.getElementById('scenario-night');
      const scenarioRoute = document.getElementById('scenario-route');
      const scenarioVariant = document.getElementById('scenario-variant');
      let scenarioPanel = null;
      const SCENARIO_STATUS = { waiting: "スタート待ち", running: "実行中", completed: "終了" };

      function setupScenarioBox(config) {
        if (!config.scenarioPanel) return;
        scenarioBox.hidden = false;
        scenarioRoute.disabled = !viewer.hasPlannedPaths();
        scenarioNight.addEventListener('change', () => viewer.setNightMode(scenarioNight.checked));
        scenarioRoute.addEventListener('change', () => viewer.setPlannedPathsVisible(scenarioRoute.checked));
        const variants = config.scenarioPanel.variants ?? [];
        if (variants.length > 0) {
          for (const variant of variants) {
            const option = document.createElement('option');
            option.value = variant.id;
            option.textContent = variant.label ?? variant.id;
            scenarioVariant.appendChild(option);
          }
          scenarioVariant.value = config.scenarioPanel.defaultVariant ?? variants[0].id;
          scenarioVariant.hidden = false;
        }
        scenarioStartBtn.addEventListener('click', async () => {
          scenarioStartBtn.disabled = true;
          // "start" or "start:<variant>", plus a nonce so a second start is a new command.
          const variant = scenarioVariant.hidden ? "" : `:${scenarioVariant.value}`;
          const ok = await scenarioPanel?.sendCommand(`start${variant}:${Date.now()}`);
          if (!ok) {
            scenarioStatus.textContent = "送信できませんでした";
            scenarioStartBtn.disabled = false;
          }
        });
      }

      const scenarioSpeeds = document.getElementById('scenario-speeds');
      // HUD over the main view (scenarioPanel.hudVehicle): its speed and the
      // ACC's state from the events, so a change of speed is seen and felt.
      const hud = document.getElementById('scenario-hud');
      const hudSpeed = document.getElementById('hud-speed');
      const hudAcc = document.getElementById('hud-acc');
      const ACC_LABEL = { follow: "ACC 追従", cruise: "ACC 加速／設定速度", hold: "ACC 速度保持",
                          canceled: "ACC 解除（運転者の操作）" };
      let hudPrevious = null;
      function renderHud() {
        const name = loadedViewerConfig?.scenarioPanel?.hudVehicle;
        if (!name) return;
        const vehicle = viewer.getVehicles().find((v) => v.vehicleId === name);
        if (!vehicle?.motion?.speed && vehicle?.motion?.speed !== 0) return;
        hud.hidden = false;
        const kmh = vehicle.motion.speed * 3.6;
        hudSpeed.innerHTML = `${kmh.toFixed(0)} <span>km/h</span>`;
        const acc = [...(scenarioPanel?.events ?? [])].reverse().find((e) => e.kind === "acc");
        const state = acc?.state ?? "follow";
        const accelerating = state === "cruise" && hudPrevious !== null && kmh > hudPrevious + 0.05;
        hudAcc.textContent = (ACC_LABEL[state] ?? `ACC ${state}`) + (accelerating ? "　▲ 加速中" : "");
        hudAcc.className = accelerating ? "accelerating" : (state === "canceled" ? "canceled" : "");
        hudPrevious = kmh;
      }

      function renderVehicleSpeeds() {
        const rows = viewer.getVehicles()
          .filter((vehicle) => vehicle.motion?.speed != null)
          .map((vehicle) => `<tr><td class="label">${vehicle.vehicleId}</td>`
            + `<td class="value">${(vehicle.motion.speed * 3.6).toFixed(0)} km/h</td></tr>`);
        scenarioSpeeds.innerHTML = rows.join("");
      }

      function renderScenarioEvents() {
        const status = scenarioPanel.status();
        scenarioStatus.textContent = SCENARIO_STATUS[status] ?? status;
        scenarioStartBtn.disabled = status !== "waiting";
        scenarioVariant.disabled = status !== "waiting";
        scenarioEvents.innerHTML = "";
        for (const event of scenarioPanel.events) {
          if (event.kind === "status") continue;
          const item = document.createElement('li');
          item.textContent = `${event.scenarioSec.toFixed(2)} s  ${event.name}  ${event.state}`;
          item.title = `箱庭時刻 ${event.hakoSec.toFixed(2)} s（${event.kind}）`;
          item.className = event.state;
          scenarioEvents.appendChild(item);
        }
        scenarioEvents.scrollTop = scenarioEvents.scrollHeight;
      }

      async function attachScenarioPanel() {
        const config = loadedViewerConfig?.scenarioPanel;
        if (!config || scenarioPanel) return;
        scenarioPanel = new ScenarioPanel(config);
        await scenarioPanel.attach();
        scenarioStatus.textContent = SCENARIO_STATUS.waiting;
        scenarioStartBtn.disabled = false;
        setInterval(() => {
          if (scenarioPanel.poll()) renderScenarioEvents();
        }, 20);
        // Traffic signal lamps (scenarioPanel.signalPdus): one PDU per signal, set by esmini.
        if (config.signalPdus && Object.keys(config.signalPdus).length) {
          const signals = new TrafficSignals(config, (predicate) => viewer.findSceneObjects(predicate));
          await signals.attach();
          setInterval(() => signals.poll(), 100);
        }
        setInterval(renderVehicleSpeeds, 250);
        setInterval(renderHud, 200);
      }

      connectBtn.addEventListener('click', async () => {
        connectBtn.disabled = true;
        connectBtn.textContent = "connecting...";

        try {
          const defaultWsUri = loadedViewerConfig?.pdu?.wsUri ?? "ws://127.0.0.1:8765";
          const wsUri = (wsUriInput?.value || "").trim() || defaultWsUri;
          const ok = await viewer.connectPdu({
            wsUri: wsUri,
          });
          if (ok) {
            await viewer.initDronePdu();

            populateDroneSelect();
            updateFaultInjectionTarget();
            applyFollowSelectedIfEnabled();
            // 100msごとに状態更新
            setInterval(updateDroneStatePanel, statePanelIntervalMsec);

            connectBtn.textContent = "connected";
            await attachScenarioPanel();
          } else {
            connectBtn.textContent = "connect failed";
            connectBtn.disabled = false;
          }
        } catch (e) {
          console.error(e);
          connectBtn.textContent = "error";
          connectBtn.disabled = false;
        }

      });

      if (droneSelect) {
        droneSelect.addEventListener("change", () => {
          applyFollowSelectedIfEnabled();
          updateFaultInjectionTarget();
        });
      }
      if (followCheckbox) {
        followCheckbox.addEventListener("change", () => {
          const enabled = !!followCheckbox.checked;
          viewer.setFollowSelectedEnabled(enabled);
          if (enabled) {
            applyFollowSelectedIfEnabled();
            showCameraMode("follow");
          }
        });
      }
      cameraDriverBtn?.addEventListener("click", () => {
        viewer.setObjectiveViewMain(false);
      });
      cameraFollowBtn?.addEventListener("click", () => {
        viewer.setObjectiveViewMain(true);
        if (followCheckbox) followCheckbox.checked = true;
        viewer.setFollowSelectedEnabled(true);
        applyFollowSelectedIfEnabled();
        showCameraMode("follow");
      });
      cameraOverviewBtn?.addEventListener("click", () => {
        viewer.setObjectiveViewMain(true);
        if (followCheckbox) followCheckbox.checked = false;
        viewer.setOverviewEnabled(true);
        showCameraMode("overview");
      });
      cameraFrontBtn?.addEventListener("click", () => {
        viewer.setObjectiveViewMain(true);
        if (followCheckbox) followCheckbox.checked = false;
        viewer.setFrontCameraEnabled(true);
        showCameraMode("front");
      });
      overviewInsetBtn?.addEventListener("click", () => {
        const enabled = overviewInsetBtn.getAttribute("aria-pressed") !== "true";
        viewer.setOverviewInsetEnabled(enabled);
        overviewInsetBtn.setAttribute("aria-pressed", String(enabled));
        overviewInsetBtn.style.fontWeight = enabled ? "bold" : "normal";
        overviewInsetBtn.style.background = enabled ? "#dbeafe" : "";
      });
      cameraZoomInBtn?.addEventListener("click", () => viewer.zoomObjectiveCamera(0.8));
      cameraZoomOutBtn?.addEventListener("click", () => viewer.zoomObjectiveCamera(1.25));
      window.addEventListener("hakoniwa-camera-mode-change", (event) => {
        showCameraMode(event.detail?.mode, event.detail);
      });
      const initialCameraView = viewer.getCameraViewState();
      showCameraMode(initialCameraView.mode, initialCameraView);

      if (faultSendBtn) {
        faultSendBtn.addEventListener("click", async () => {
          setFaultStatus("sending...");
          await sendCurrentRotorScales();
        });
      }

      if (faultResetBtn) {
        faultResetBtn.addEventListener("click", async () => {
          const resetScales = viewer.resetRotorFaultScales();
          setRotorScalesToInputs(resetScales);
          setFaultStatus("sending nominal...");
          await sendCurrentRotorScales();
        });
      }
    });
  </script>
</body>
</html>
